<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立葵_Tachi | 工程与资源</title>
    <style>
        body { margin: 0; padding: 40px 20px; background-color: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .back-btn { position: fixed; top: 20px; left: 20px; color: #aaa; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 0.9em; transition: 0.3s;}
        .back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        h1 { font-size: 2em; margin-bottom: 30px; letter-spacing: 2px; }
        .resource-list { text-align: left; }
        .resource-item { display: flex; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; margin-bottom: 15px; backdrop-filter: blur(10px); transition: 0.3s;}
        .resource-item:hover { background: rgba(255,255,255,0.06); }
        .resource-icon { font-size: 2em; margin-right: 20px; }
        .resource-info { flex: 1; }
        .resource-info h3 { margin: 0 0 5px; font-size: 1.1em; }
        .resource-info p { margin: 0; color: #888; font-size: 0.9em; }
        .download-btn { background: #fff; color: #000; border: none; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 0.9em; transition: 0.3s;}
        .download-btn:hover { background: #ddd; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回主页</a>
    <div class="container">
        <h1>工程与资源分享</h1>
        
        <div class="resource-list">
            <!-- 资源 1 -->
            <div class="resource-item">
                <div class="resource-icon">🎹</div>
                <div class="resource-info">
                    <h3>自作工程配布</h3>
                    <p>希望有你想要的工程。</p>
                </div>
                <a href="#" class="download-btn">点击选择</a>
            </div>

            <!-- 资源 2 -->
            <div class="resource-item">
                <div class="resource-icon">🪵</div>
                <div class="resource-info">
                    <h3>滚木</h3>
                    <p>滚木滚木</p>
                </div>
                <a href="#" class="download-btn">点击选择</a>
            </div>
        </div>
    </div>
</body>
</html>
