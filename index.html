<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立葵_Tachi  Vocaloid调音师</title>
    <style>
        /* 基础全局设置 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a; /* 深色背景 */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 模拟音频波形的极简背景 */
            background-image: 
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 20px),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 20px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 头部个人简介区 */
        header {
            text-align: center;
            padding: 80px 20px 40px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
            background-color: #1a1a1a; /* 占位背景色，以后换成你的头像图片 */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }
        h1 {
            margin: 0;
            font-size: 2.8em;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #aaa;
            margin-top: 10px;
            font-size: 1.1em;
            letter-spacing: 1px;
        }
        .tags {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 作品集卡片网格区 */
        .container {
            max-width: 1000px;
            width: 100%;
            padding: 40px 20px 80px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        
        /* 高级感卡片设计 (玻璃拟态) */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .card .icon {
            font-size: 3em;
            margin-bottom: 20px;
            display: block;
            opacity: 0.8;
            transition: transform 0.4s ease;
        }
        .card:hover .icon {
            transform: scale(1.1);
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.3em;
            font-weight: 600;
        }
        .card p {
            margin: 0;
            font-size: 0.9em;
            color: #888;
            line-height: 1.6;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 0.85em;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <header>
        <div class="avatar">🎧</div>
        <h1>Aoitachi</h1>
        <p class="subtitle">擅长UTAU,Synthesizer V™和VOCALOID™的调音师</p>
        <div class="tags">
            <span class="tag">VOCALOID</span>
            <span class="tag">UTAU</span>
            <span class="tag">Synthesizer V</span>
        </div>
    </header>

    <div class="container">
        <div class="grid">
            <a href="works.html" class="card">
                <span class="icon">🎙️</span>
                <h3>调音作品</h3>
                <p>B站投稿、工程展示</p>
            </a>
            
            <a href="resources.html" class="card">
                <span class="icon">💾</span>
                <h3>工程与资源</h3>
                <p>自用工程、调音、自作UTAU声库、工程及免费素材分享</p>
            </a>

            <a href="blog.html" class="card">
                <span class="icon">📝</span>
                <h3>个人随笔</h3>
                <p>喵喵喵。！</p>
            </a>
        </div>
    </div>

    <footer>
        <p>© 2026 Aoitachi. All rights reserved.</p>
    </footer>

</body>
</html>
